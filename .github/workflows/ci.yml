name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # NOTE: lint は未セットアップ（ESLint / config 未導入）のため意図的に外している。
      # eslint-config-next 等を入れたら独立ステップとして追加する。
      # 握り潰した continue-on-error で「lint通過」に見せないための措置。
